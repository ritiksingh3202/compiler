[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Tiny Compiler Contributors"]

[workspace.dependencies]
thiserror = "2"
tiny-lexer = { path = "crates/tiny-lexer" }
tiny-ast = { path = "crates/tiny-ast" }
tiny-parser = { path = "crates/tiny-parser" }
tiny-sema = { path = "crates/tiny-sema" }
tiny-interp = { path = "crates/tiny-interp" }
tiny-ir = { path = "crates/tiny-ir" }
tiny-codegen = { path = "crates/tiny-codegen" }
